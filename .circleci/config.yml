package-cache: &package-cache
  key: npm-cache-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}

version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.14
    working_directory: ~/logentries-webhook-auth
    steps:
      - checkout
      - restore_cache:
          <<: *package-cache
      - run: npm install
      - save_cache:
          <<: *package-cache
          paths:
            - node_modules
      - run: npm run build
      - run: npm test

  publish:
    docker:
      - image: cimg/node:24.14
    working_directory: ~/logentries-webhook-auth
    steps:
      - checkout
      - restore_cache:
          <<: *package-cache
      - run: npm install
      - save_cache:
          <<: *package-cache
          paths:
            - node_modules
      - run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
      - run: npm run build
      - run: npm publish

workflows:
  build-and-publish:
    jobs:
      - build
      - publish:
          requires:
            - build
          filters:
            branches:
              only: master
